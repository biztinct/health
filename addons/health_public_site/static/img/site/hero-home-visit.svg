<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <!-- CareJiyo hero: a nurse visiting an older woman at home. Flat, single-colour shapes only. -->
  <!-- room -->
  <circle cx="300" cy="262" r="238" fill="#F3E9DC"/>
  <rect x="96" y="82" width="148" height="150" rx="14" fill="#DCEAFB"/>
  <circle cx="200" cy="128" r="22" fill="#FDE7CC"/>
  <rect x="96" y="152" width="148" height="8" fill="#FFFFFF"/>
  <rect x="166" y="82" width="8" height="150" fill="#FFFFFF"/>
  <rect x="88" y="226" width="164" height="12" rx="6" fill="#E8D9C4"/>
  <!-- picture frame -->
  <rect x="300" y="96" width="78" height="62" rx="8" fill="#FFFFFF"/>
  <path d="M312 146l18-22 14 14 10-10 14 18z" fill="#8FC9A3"/>
  <circle cx="356" cy="114" r="7" fill="#FB8C00"/>
  <!-- floor -->
  <rect x="62" y="452" width="476" height="20" rx="10" fill="#E8D9C4"/>
  <!-- plant -->
  <path d="M484 452l-8-52h56l-8 52z" fill="#E8836B"/>
  <ellipse cx="490" cy="370" rx="14" ry="34" fill="#5FA97A" transform="rotate(-24 490 370)"/>
  <ellipse cx="518" cy="364" rx="14" ry="38" fill="#3F8A5E" transform="rotate(18 518 364)"/>
  <ellipse cx="504" cy="352" rx="12" ry="40" fill="#5FA97A"/>
  <!-- side table + tea -->
  <rect x="44" y="360" width="64" height="10" rx="5" fill="#C9A77C"/>
  <rect x="70" y="370" width="12" height="82" fill="#C9A77C"/>
  <rect x="58" y="336" width="24" height="24" rx="6" fill="#1565C0"/>
  <path d="M82 342a8 8 0 0 1 0 12" fill="none" stroke="#1565C0" stroke-width="4"/>
  <path d="M64 330c0-6 6-6 6-12M74 330c0-6 6-6 6-12" fill="none" stroke="#D9CBB6" stroke-width="3" stroke-linecap="round"/>
  <!-- armchair -->
  <rect x="128" y="250" width="186" height="190" rx="46" fill="#E9A24A"/>
  <rect x="104" y="330" width="54" height="104" rx="24" fill="#D98E35"/>
  <rect x="286" y="330" width="54" height="104" rx="24" fill="#D98E35"/>
  <rect x="150" y="440" width="12" height="14" rx="3" fill="#13233F"/>
  <rect x="282" y="440" width="12" height="14" rx="3" fill="#13233F"/>
  <!-- older woman: body -->
  <rect x="170" y="290" width="104" height="100" rx="40" fill="#5B7FD6"/>
  <path d="M206 292l16 30 16-30z" fill="#FFFFFF"/>
  <!-- blanket on lap -->
  <rect x="150" y="364" width="150" height="66" rx="24" fill="#FDE7CC"/>
  <path d="M168 380h114M168 398h114M168 416h114" stroke="#F6C58E" stroke-width="5" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="196" cy="446" rx="20" ry="9" fill="#13233F"/>
  <ellipse cx="252" cy="446" rx="20" ry="9" fill="#13233F"/>
  <!-- left arm resting -->
  <path d="M180 318c-10 26-6 46 8 58" fill="none" stroke="#5B7FD6" stroke-width="22" stroke-linecap="round"/>
  <!-- right arm out to the nurse, cuff on it -->
  <path d="M262 314c18 18 40 28 70 30" fill="none" stroke="#5B7FD6" stroke-width="22" stroke-linecap="round"/>
  <rect x="284" y="326" width="30" height="26" rx="6" fill="#13233F" transform="rotate(14 299 339)"/>
  <circle cx="340" cy="345" r="11" fill="#F3CDB0"/>
  <!-- head -->
  <rect x="212" y="268" width="20" height="24" rx="8" fill="#E8B896"/>
  <circle cx="222" cy="246" r="32" fill="#F3CDB0"/>
  <path d="M190 246c0-24 14-36 32-36s32 12 32 36c-6-14-18-20-32-20s-26 6-32 20z" fill="#D9D4CC"/>
  <circle cx="222" cy="206" r="15" fill="#D9D4CC"/>
  <circle cx="190" cy="250" r="6" fill="#F3CDB0"/>
  <circle cx="211" cy="250" r="8" fill="none" stroke="#13233F" stroke-width="2.5"/>
  <circle cx="235" cy="250" r="8" fill="none" stroke="#13233F" stroke-width="2.5"/>
  <path d="M219 250h8" stroke="#13233F" stroke-width="2.5"/>
  <circle cx="211" cy="250" r="2.5" fill="#13233F"/>
  <circle cx="235" cy="250" r="2.5" fill="#13233F"/>
  <path d="M213 264q10 8 20 0" fill="none" stroke="#B5694F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="204" cy="262" r="5" fill="#F4A9A0" opacity="1"/>
  <circle cx="242" cy="262" r="5" fill="#F4A9A0"/>
  <!-- nurse: legs -->
  <rect x="380" y="370" width="28" height="78" rx="12" fill="#1F7A6F"/>
  <rect x="414" y="370" width="28" height="78" rx="12" fill="#1F7A6F"/>
  <ellipse cx="390" cy="450" rx="20" ry="9" fill="#FFFFFF"/>
  <ellipse cx="434" cy="450" rx="20" ry="9" fill="#FFFFFF"/>
  <!-- nurse: torso -->
  <path d="M372 270c0-18 14-30 32-30h18c18 0 32 12 32 30v112h-82z" fill="#2A9D8F"/>
  <path d="M398 240l15 26 15-26z" fill="#7A4B33"/>
  <rect x="426" y="300" width="18" height="22" rx="3" fill="#FFFFFF"/>
  <rect x="430" y="304" width="10" height="3" rx="1.5" fill="#2A9D8F"/>
  <!-- stethoscope -->
  <path d="M392 244c-6 22-4 42 10 52M434 244c6 22 4 42-10 52" fill="none" stroke="#13233F" stroke-width="4" stroke-linecap="round"/>
  <path d="M402 296q11 8 22 0" fill="none" stroke="#13233F" stroke-width="4" stroke-linecap="round"/>
  <circle cx="413" cy="318" r="7" fill="#13233F"/>
  <!-- nurse: arm to patient's hand -->
  <path d="M380 266c-14 26-22 52-30 76" fill="none" stroke="#2A9D8F" stroke-width="22" stroke-linecap="round"/>
  <circle cx="350" cy="350" r="11" fill="#7A4B33"/>
  <!-- nurse: arm holding tablet -->
  <path d="M446 266c14 22 16 44 8 62l-22 6" fill="none" stroke="#2A9D8F" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="412" y="318" width="40" height="52" rx="7" fill="#13233F" transform="rotate(-12 432 344)"/>
  <rect x="418" y="325" width="28" height="36" rx="3" fill="#DCEAFB" transform="rotate(-12 432 344)"/>
  <path d="M420 346l6 0 4-8 5 14 4-6h6" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-12 432 344)"/>
  <circle cx="430" cy="368" r="10" fill="#7A4B33"/>
  <!-- nurse: head -->
  <rect x="403" y="214" width="20" height="28" rx="8" fill="#6A402B"/>
  <circle cx="413" cy="200" r="31" fill="#7A4B33"/>
  <path d="M382 200c-2-24 12-38 31-38s34 12 32 34c-10-12-24-16-36-16-12 0-22 8-27 20z" fill="#2B2118"/>
  <circle cx="446" cy="186" r="15" fill="#2B2118"/>
  <path d="M440 200c12 10 14 26 8 40" fill="none" stroke="#2B2118" stroke-width="12" stroke-linecap="round"/>
  <circle cx="401" cy="204" r="3" fill="#13233F"/>
  <circle cx="424" cy="204" r="3" fill="#13233F"/>
  <path d="M403 216q9 8 18 0" fill="none" stroke="#3A2015" stroke-width="3" stroke-linecap="round"/>
  <!-- care heart between them -->
  <path d="M300 214c-10-14-32-8-32 8 0 16 32 30 32 30s32-14 32-30c0-16-22-22-32-8z" fill="#FB8C00"/>
  <path d="M286 228h7l4-7 5 13 4-6h8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
