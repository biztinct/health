<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Staff Schedule — Design Directions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS (VU Indigo Workspace — consistent with the form engine)
   ============================================================ */
:root{
  --primary:#1565C0; --primary-soft:#E8F0FB; --ink:#101728; --muted:#6B7280;
  --faint:#9CA3AF; --line:#E5E7EB; --line-soft:#F1F0F7; --bg:#F4F6FB; --surface:#FFFFFF;
  --navy:#0F1E45;
  --ok:#16A34A; --ok-bg:#E7F6EF; --warn:#B45309; --danger:#DC2626; --danger-bg:#FDECEC;
  /* assignment state colors */
  --s-draft:#94A3B8; --s-assigned:#2563EB; --s-confirmed:#0EA5E9; --s-progress:#16A34A;
  --s-completed:#14B8A6; --s-cancelled:#EF4444;
  /* availability */
  --av-work:#FFFFFF; --av-off:#EEF1F5; --av-leave:#FDE3E1;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-sm:0 1px 2px rgba(16,12,40,.05); --sh-md:0 8px 24px rgba(16,12,40,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter",-apple-system,Segoe UI,sans-serif;background:#0B1226;color:var(--ink);-webkit-font-smoothing:antialiased}

/* ---------- chooser ---------- */
.chooser{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0D1834,#0B1530);color:#fff;padding:16px 26px 0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.chooser h1{font-size:18px;font-weight:800}
.chooser p{font-size:12.5px;color:#9FACCB;margin-top:3px}
.ctabs{display:flex;gap:10px;margin-top:14px}
.ctab{flex:1;max-width:430px;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-bottom:none;border-radius:13px 13px 0 0;padding:13px 18px 15px;color:#C7D2EC;cursor:pointer;transition:background .15s;position:relative}
.ctab:hover{background:rgba(255,255,255,.10)}
.ctab.on{background:var(--bg);color:var(--ink)}
.ctab .k{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:7px;font-weight:800;font-size:12px;margin-right:8px;color:#fff}
.ctab.a .k{background:#1565C0}.ctab.b .k{background:#0EA5E9}.ctab.c .k{background:#7C3AED}
.ctab .t{font-weight:700;font-size:14px}
.ctab .d{display:block;font-size:11.5px;margin-top:4px;opacity:.78;line-height:1.45}
.ctab.on .d{opacity:.62}

/* ---------- panels ---------- */
.panel{display:none}.panel.on{display:block}
.stage{background:var(--bg);min-height:calc(100vh - 132px);padding:22px clamp(14px,3vw,40px) 70px}

/* shared top bar of the merged view */
.sv-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sv-title{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sv-datenav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-soft);border-radius:999px;padding:4px 6px;box-shadow:var(--sh-sm)}
.sv-datenav button{border:none;background:none;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:14px}
.sv-datenav button:hover{background:var(--primary-soft);color:var(--primary)}
.sv-datenav .lbl{font-size:13px;font-weight:600;padding:0 8px;min-width:150px;text-align:center}
.sv-today{font-size:13px;font-weight:600;color:var(--primary);cursor:pointer}
.seg{display:flex;background:#EBEEF6;border-radius:999px;padding:3px;gap:2px}
.seg button{border:none;background:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;color:var(--primary);box-shadow:var(--sh-sm)}
.sv-spacer{flex:1}
.sv-search{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;font-size:13px;color:var(--faint);min-width:200px}

/* summary chips */
.sv-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sv-stat{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:10px 16px;box-shadow:var(--sh-sm);min-width:130px}
.sv-stat .dot{width:9px;height:9px;border-radius:50%}
.sv-stat .v{font-weight:800;font-size:17px;line-height:1}
.sv-stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:11.5px;color:var(--muted)}
.legend .item{display:flex;align-items:center;gap:6px}
.legend .sw{width:22px;height:13px;border-radius:3px;border:1px solid var(--line)}
.sw-work{background:var(--av-work)}
.sw-off{background:repeating-linear-gradient(45deg,#EEF1F5,#EEF1F5 4px,#E3E7EE 4px,#E3E7EE 8px)}
.sw-leave{background:repeating-linear-gradient(45deg,#FDE3E1,#FDE3E1 4px,#F7C9C5 4px,#F7C9C5 8px)}
.sw-dot{width:13px;height:13px;border-radius:4px}

/* ============================================================
   SHARED GRID PRIMITIVES (used by A & B with theming)
   ============================================================ */
.tl{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--sh-md);overflow:hidden}
.tl-head{display:grid;grid-template-columns:var(--namew) 1fr;border-bottom:1px solid var(--line-soft);background:#FBFCFE}
.tl-head .corner{padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line-soft);display:flex;align-items:flex-end}
.tl-axis{position:relative;height:38px}
.tl-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft);font-size:10.5px;color:var(--faint);padding:6px 0 0 5px}
.tl-row{display:grid;grid-template-columns:var(--namew) 1fr;border-bottom:1px solid var(--line-soft);min-height:54px}
.tl-row:last-child{border-bottom:none}
.tl-name{display:flex;align-items:center;gap:10px;padding:8px 14px;border-right:1px solid var(--line-soft);background:#fff}
.av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 auto}
.tl-name .nm{font-size:13px;font-weight:600;line-height:1.15}
.tl-name .fc{font-size:11px;color:var(--faint)}
.tl-name .st{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:999px;margin-left:auto}
.st-av{background:var(--ok-bg);color:var(--ok)} .st-off{background:#EEF1F5;color:var(--muted)} .st-leave{background:var(--danger-bg);color:var(--danger)}
.tl-lane{position:relative;overflow:hidden}
/* availability backgrounds */
.lane-bg{position:absolute;inset:0}
.bg-off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#EEF1F5,#EEF1F5 5px,#E6EAF1 5px,#E6EAF1 10px)}
.bg-leave{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#FDE3E1,#FDE3E1 5px,#F7CDC9 5px,#F7CDC9 10px)}
.lane-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
/* assignment card */
.asg{position:absolute;top:7px;height:38px;border-radius:8px;padding:5px 9px;color:#fff;font-size:11px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden;cursor:grab;display:flex;flex-direction:column;justify-content:center;border-left:3px solid rgba(255,255,255,.5)}
.asg .a-t{font-size:9.5px;opacity:.92;font-weight:500}
.asg.assigned{background:var(--s-assigned)} .asg.confirmed{background:var(--s-confirmed)}
.asg.progress{background:var(--s-progress)} .asg.completed{background:var(--s-completed)} .asg.draft{background:var(--s-draft)}
/* now line */
.nowline{position:absolute;top:-38px;bottom:0;width:2px;background:var(--danger);z-index:5}
.nowline::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
/* drag-block demo */
.ghost{position:absolute;top:7px;height:38px;border-radius:8px;border:2px dashed var(--danger);background:rgba(220,38,38,.10);display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;color:var(--danger);z-index:6;cursor:not-allowed}
.ghost .no{font-size:14px}

/* ============================================================
   DIRECTION B overrides (FullCalendar premium look)
   ============================================================ */
.dir-b .tl{border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 10px 30px rgba(16,12,40,.05)}
.dir-b .tl-head{background:#fff}
.dir-b .bg-work-b{position:absolute;top:0;bottom:0;background:#F4F9FF}     /* businessHours light blue */
.dir-b .bg-off{background:#FAFBFC}
.dir-b .tl-tick{font-weight:600;color:#94A3B8}
.dir-b .asg{border-radius:6px;border-left-width:3px;box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.dir-b .tl-row{min-height:58px}
.dir-b .av{border-radius:50%}
.dir-b .more{position:absolute;top:9px;height:34px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:6px}
.dir-b-wrap{display:grid;grid-template-columns:1fr 230px;gap:16px;align-items:start}
.mininav{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:14px}
.mininav h4{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px}
.cal .dow{color:var(--faint);text-align:center;font-weight:600;padding:3px 0}
.cal .d{text-align:center;padding:5px 0;border-radius:6px;cursor:pointer}
.cal .d:hover{background:var(--primary-soft)}
.cal .d.sel{background:var(--primary);color:#fff;font-weight:700}
.cal .d.mut{color:var(--faint)}
.mininav .util{margin-top:14px}
.mininav .util .row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.bar{height:6px;border-radius:3px;background:#EEF1F5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}

/* ============================================================
   DIRECTION C (custom OWL dashboard) — lanes + heatmap + side rail
   ============================================================ */
.dir-c-wrap{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
.lanes{display:flex;flex-direction:column;gap:12px}
.lane-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:14px 16px;display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:center}
.lane-card.leave{background:#FFF7F6;border-color:#F7CDC9}
.lane-id{display:flex;align-items:center;gap:11px}
.lane-id .meta .nm{font-size:14px;font-weight:700}
.lane-id .meta .fc{font-size:11.5px;color:var(--faint)}
.lane-id .meta .pill{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-top:4px}
.cap{margin-top:7px;width:160px}
.cap .lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:3px}
.heat{display:flex;gap:2px;align-items:center}
.cell{flex:1;height:34px;border-radius:4px;position:relative}
.cell.work{background:#EAF3FF}
.cell.off{background:repeating-linear-gradient(45deg,#EEF1F5,#EEF1F5 4px,#E4E8EF 4px,#E4E8EF 8px)}
.cell.leave{background:repeating-linear-gradient(45deg,#FDE3E1,#FDE3E1 4px,#F6CAC6 4px,#F6CAC6 8px)}
.cell .job{position:absolute;inset:2px;border-radius:4px;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;overflow:hidden}
.heat-axis{display:flex;gap:2px;margin-top:5px}
.heat-axis span{flex:1;text-align:center;font-size:9px;color:var(--faint)}
.siderail{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:14px;position:sticky;top:14px}
.siderail h4{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.siderail .sub{font-size:11px;color:var(--faint);margin-bottom:12px}
.ub{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:9px;cursor:grab;background:#fff}
.ub .nm{font-size:12.5px;font-weight:700}
.ub .meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;gap:10px}
.ub .tag{font-size:9.5px;font-weight:700;color:var(--warn);background:#FDF3E2;border-radius:999px;padding:1px 8px}

/* footnote */
.note{max-width:1500px;margin:22px auto 0;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--sh-sm);padding:16px 20px;font-size:13px;color:var(--muted);line-height:1.6}
.note b{color:var(--ink)} .note .pro{color:var(--ok);font-weight:600}.note .con{color:var(--warn);font-weight:600}
.foot{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;background:#0F1E45;color:#fff;font-size:13px;font-weight:600;padding:10px 22px;border-radius:999px;box-shadow:0 12px 36px rgba(0,0,0,.35);white-space:nowrap}
.foot .k{background:rgba(255,255,255,.16);padding:2px 9px;border-radius:6px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="chooser">
  <h1>Unified Staff Schedule — pick a direction</h1>
  <p>One view replacing Roster · Schedules · Staff Assignment · Roster Planning. Working hours, off-hours &amp; leave are shaded; cards can't be dropped where staff aren't available.</p>
  <div class="ctabs">
    <button class="ctab a on" data-p="pa" onclick="show(this)"><span class="k">A</span><span class="t">Enhanced Timeline</span><span class="d">Horizontal resource Gantt — an upgrade of today's Staff Assignment view with availability shading. Familiar, fast.</span></button>
    <button class="ctab b" data-p="pb" onclick="show(this)"><span class="k">B</span><span class="t">Premium Scheduler</span><span class="d">FullCalendar resource-timeline: business-hours shading, mini-month nav, polished stacking. Best-in-class feel.</span></button>
    <button class="ctab c" data-p="pc" onclick="show(this)"><span class="k">C</span><span class="t">Ops Dashboard</span><span class="d">VU-themed staff lanes with an availability heatmap, capacity bars, and an unassigned-bookings side rail to drag from.</span></button>
  </div>
</div>

<!-- shared top-bar + stats + legend builder via JS into each panel -->
<div id="pa" class="panel dir-a on"></div>
<div id="pb" class="panel dir-b"></div>
<div id="pc" class="panel dir-c"></div>

<div class="foot">Tell Claude: <span class="k">A</span> <span class="k">B</span> or <span class="k">C</span> — then I build the backend API + that UI</div>

<script>
/* ---------- seed data (real roster staff) ---------- */
const H0=7, H1=21; // 7AM..9PM
const HUE=v=>`hsl(${v},55%,50%)`;
const STAFF=[
  {n:"Nurse HCMC",   i:"NH", c:HUE(210), fc:"HCM Facility",  work:[8,17], leave:null, st:"av"},
  {n:"Nurse Alpha",  i:"NA", c:HUE(150), fc:"HCM Facility",  work:[9,18], leave:null, st:"av"},
  {n:"HUỲNH NHI",    i:"HN", c:HUE(0),   fc:"HCM Facility",  work:[7.5,16.5], leave:null, st:"av"},
  {n:"TRẦN THANH TÂM",i:"TT",c:HUE(280), fc:"HCM Facility",  work:[8,17], leave:null, st:"av"},
  {n:"Trần Thị Mỹ Duyên",i:"TD",c:HUE(330),fc:"Hanoi Facility",work:[9,17], leave:null, st:"av"},
  {n:"Võ Phú Thành", i:"VP", c:HUE(40),  fc:"HCM Facility",  work:null, leave:[H0,H1], st:"leave"}, // on leave all day
  {n:"L.ThiHongQuynh",i:"LQ",c:HUE(190), fc:"HCM Facility",  work:[13,20], leave:null, st:"av"},
  {n:"Doctor HCMC",  i:"DH", c:HUE(25),  fc:"HCM Facility",  work:[8,12], leave:null, st:"av"},
];
const ASG=[ // staff index, startHour, durHours, patient, code, state
  {s:0, h:9,  d:2, p:"An Xu",  code:"02 002402026", state:"assigned"},
  {s:0, h:14, d:1.5,p:"Bùi T", code:"01 000972026", state:"confirmed"},
  {s:2, h:8,  d:1, p:"Chinh",  code:"02 002832026", state:"progress"},
  {s:2, h:10.5,d:2,p:"Hồ Ki",  code:"02 002962026", state:"assigned"},
  {s:3, h:9,  d:2, p:"Phươn",  code:"01 001262026", state:"completed"},
  {s:6, h:15, d:2, p:"Kiara",  code:"02 003082026", state:"assigned"},
  {s:7, h:9,  d:1.5,p:"C Hồn",  code:"02 002512026", state:"confirmed"},
];
const NOW=14.5; // now-line at 14:30
const stateLabel={assigned:"Assigned",confirmed:"Confirmed",progress:"In Service",completed:"Completed",draft:"Draft"};

/* ---------- shared chrome (top bar, stats, legend) ---------- */
function chrome(view){
  return `
  <div class="sv-top">
    <div class="sv-title">Staff Schedule</div>
    <div class="sv-datenav"><button>‹</button><span class="lbl">Sat, June 13, 2026</span><button>›</button></div>
    <span class="sv-today">Today</span>
    <div class="seg"><button class="${view==='day'?'on':''}" onclick="setView('${cur}','day')">Day</button><button class="${view==='week'?'on':''}" onclick="setView('${cur}','week')">Week</button><button>Month</button></div>
    <div class="sv-spacer"></div>
    <div class="sv-search">🔍 Search staff…</div>
  </div>
  <div class="sv-stats">
    <div class="sv-stat"><span class="dot" style="background:var(--muted)"></span><div><div class="v">59</div><div class="l">Total Staff</div></div></div>
    <div class="sv-stat"><span class="dot" style="background:var(--ok)"></span><div><div class="v">7</div><div class="l">Available now</div></div></div>
    <div class="sv-stat"><span class="dot" style="background:var(--s-progress)"></span><div><div class="v">1</div><div class="l">In Service</div></div></div>
    <div class="sv-stat"><span class="dot" style="background:var(--danger)"></span><div><div class="v">1</div><div class="l">On Leave</div></div></div>
    <div class="sv-stat"><span class="dot" style="background:var(--warn)"></span><div><div class="v">3</div><div class="l">Unassigned bookings</div></div></div>
  </div>
  <div class="legend">
    <span class="item"><span class="sw sw-work"></span>Working hours</span>
    <span class="item"><span class="sw sw-off"></span>Off-hours (no drop)</span>
    <span class="item"><span class="sw sw-leave"></span>Leave / Time-off (no drop)</span>
    <span style="width:14px"></span>
    <span class="item"><span class="sw sw-dot" style="background:var(--s-assigned)"></span>Assigned</span>
    <span class="item"><span class="sw sw-dot" style="background:var(--s-confirmed)"></span>Confirmed</span>
    <span class="item"><span class="sw sw-dot" style="background:var(--s-progress)"></span>In Service</span>
    <span class="item"><span class="sw sw-dot" style="background:var(--s-completed)"></span>Completed</span>
  </div>`;
}

/* ---------- timeline grid (A & B share, theme via class) ---------- */
const NAMEW=230;
function pct(h){return ((h-H0)/(H1-H0))*100;}
function timelineGrid(opts){
  const {workBgClass='', dayMode=true} = opts||{};
  const hours=[];for(let h=H0;h<=H1;h++)hours.push(h);
  // axis ticks
  let axis='';hours.forEach(h=>{axis+=`<div class="tl-tick" style="left:${pct(h)}%">${h>12?h-12:h}${h>=12?'p':'a'}</div>`;});
  // rows
  let rows='';
  STAFF.forEach((s,si)=>{
    // backgrounds
    let bg='';
    if(s.leave){bg+=`<div class="bg-leave" style="left:0;right:0"></div>`;}
    else{
      // off-hours before & after work
      const [a,b]=s.work;
      if(workBgClass)bg+=`<div class="${workBgClass}" style="left:${pct(a)}%;right:${100-pct(b)}%"></div>`;
      bg+=`<div class="bg-off" style="left:0;width:${pct(a)}%"></div>`;
      bg+=`<div class="bg-off" style="left:${pct(b)}%;right:0"></div>`;
    }
    // hour gridlines
    let grid='';hours.forEach(h=>{grid+=`<div class="lane-grid" style="left:${pct(h)}%"></div>`;});
    // assignments for this staff
    let cards='';
    ASG.filter(a=>a.s===si).forEach(a=>{
      const left=pct(a.h), w=(a.d/(H1-H0))*100;
      const t=`${a.h>12?a.h-12:a.h}:${(a.h%1)?'30':'00'} ${a.h>=12?'PM':'AM'}`;
      cards+=`<div class="asg ${a.state}" style="left:${left}%;width:${w}%"><div>${a.p}</div><div class="a-t">${t} · ${a.d}h</div></div>`;
    });
    // drag-block ghost demo on the leave row (Võ Phú Thành) — a card being dragged onto leave
    let ghost='';
    if(si===5){ghost=`<div class="ghost" style="left:${pct(10)}%;width:${(2/(H1-H0))*100}%"><span class="no">⊘</span>Can't drop — on leave</div>`;}
    // now line on first row only (spans visually via tall element); we add a full-height now line separately
    rows+=`<div class="tl-row">
      <div class="tl-name"><span class="av" style="background:${s.c}">${s.i}</span>
        <div><div class="nm">${s.n}</div><div class="fc">${s.fc}</div></div>
        <span class="st st-${s.st}">${s.st==='av'?'Available':s.st==='leave'?'Leave':'Off'}</span>
      </div>
      <div class="tl-lane">${bg}${grid}${cards}${ghost}</div>
    </div>`;
  });
  // now-line overlay (absolute across all lanes): approximate with a tall element positioned in first lane
  return `
   <div class="tl" style="--namew:${NAMEW}px">
     <div class="tl-head"><div class="corner">Staff</div><div class="tl-axis">${axis}</div></div>
     <div style="position:relative">
       ${rows}
       <div class="nowline" style="left:calc(${NAMEW}px + ${pct(NOW)}% - ${NAMEW*pct(NOW)/100}px);top:0;bottom:0"></div>
     </div>
   </div>`;
}
/* the now-line math above is approximate for a mockup; place a simpler one: */
function nowOverlay(){return '';}

/* ---------- Direction A ---------- */
function renderA(view){
  let body;
  if(view==='week'){body=weekGrid('');}
  else body=timelineGrid({workBgClass:''});
  return chrome(view)+body+noteA();
}
/* ---------- Direction B (premium + mini nav) ---------- */
function renderB(view){
  let grid = view==='week'? weekGrid('bg-work-b') : timelineGrid({workBgClass:'bg-work-b'});
  // add a "+2 more" stack chip demo into B on row 0 (visual only) handled in grid already minimal
  const nav=`<div class="mininav">
     <h4>June 2026</h4>
     <div class="cal">
       <span class="dow">M</span><span class="dow">T</span><span class="dow">W</span><span class="dow">T</span><span class="dow">F</span><span class="dow">S</span><span class="dow">S</span>
       ${[...Array(30)].map((_,i)=>`<span class="d ${i+1===13?'sel':''}">${i+1}</span>`).join('')}
     </div>
     <div class="util">
       <h4 style="margin-top:14px">Utilisation today</h4>
       ${STAFF.slice(0,5).map((s,i)=>`<div class="row"><span>${s.n.split(' ')[0]}</span><span>${[40,25,60,30,55][i]}%</span></div><div class="bar"><i style="width:${[40,25,60,30,55][i]}%"></i></div>`).join('')}
     </div>
   </div>`;
  return chrome(view)+`<div class="dir-b-wrap">${grid}${nav}</div>`+noteB();
}
/* ---------- Direction C (dashboard lanes) ---------- */
function renderC(view){
  const HH=[];for(let h=H0;h<H1;h++)HH.push(h);
  const lanes=STAFF.map((s,si)=>{
    const cells=HH.map(h=>{
      let cls='off';
      if(s.leave)cls='leave';
      else if(h>=s.work[0]&&h<s.work[1])cls='work';
      // assignment in this hour?
      const a=ASG.find(x=>x.s===si && h>=x.h && h<x.h+x.d);
      const job=a?`<div class="job ${a.state}" style="background:var(--s-${a.state})">${h===Math.floor(a.h)?a.p:''}</div>`:'';
      return `<div class="cell ${cls}">${job}</div>`;
    }).join('');
    const util=s.leave?0:[40,25,60,30,55,0,35,50][si];
    const pillCls=s.st==='av'?'st-av':s.st==='leave'?'st-leave':'st-off';
    const pillTxt=s.st==='av'?'Available':s.st==='leave'?'On Leave':'Off';
    return `<div class="lane-card ${s.leave?'leave':''}">
      <div>
        <div class="lane-id"><span class="av" style="background:${s.c}">${s.i}</span>
          <div class="meta"><div class="nm">${s.n}</div><div class="fc">${s.fc}</div>
            <span class="pill ${pillCls}">${pillTxt}</span></div></div>
        <div class="cap"><div class="lab"><span>Capacity</span><span>${util}%</span></div><div class="bar"><i style="width:${util}%"></i></div></div>
      </div>
      <div><div class="heat">${cells}</div><div class="heat-axis">${HH.filter((h,i)=>i%2===0).map(h=>`<span>${h>12?h-12:h}${h>=12?'p':'a'}</span>`).join('')}</div></div>
    </div>`;
  }).join('');
  const rail=`<div class="siderail"><h4>Unassigned bookings</h4><div class="sub">Drag onto an available slot</div>
     <div class="ub"><div class="nm">Nguyễn Văn An</div><div class="meta"><span>Home Visit · 2h</span><span class="tag">HCM</span></div></div>
     <div class="ub"><div class="nm">Bành</div><div class="meta"><span>Home Visit · 1h</span><span class="tag">HCM</span></div></div>
     <div class="ub"><div class="nm">Hoàng</div><div class="meta"><span>Nursing · 1.5h</span><span class="tag">Hanoi</span></div></div>
  </div>`;
  return chrome(view)+`<div class="dir-c-wrap"><div class="lanes">${lanes}</div>${rail}</div>`+noteC();
}

/* ---------- week grid (simplified 7-day for the toggle) ---------- */
function weekGrid(workBgClass){
  const days=['Mon 8','Tue 9','Wed 10','Thu 11','Fri 12','Sat 13','Sun 14'];
  let axis=days.map((d,i)=>`<div class="tl-tick" style="left:${(i/7)*100}%;width:${100/7}%;border-left:1px solid var(--line-soft)">${d}</div>`).join('');
  let rows=STAFF.map((s,si)=>{
    let bg='';
    // Sunday off for everyone; the leave person off Tue-Wed
    days.forEach((d,i)=>{
      const x=(i/7)*100,w=100/7;
      let off=(i===6); let leave=(si===5 && (i>=1&&i<=3));
      if(leave)bg+=`<div class="bg-leave" style="left:${x}%;width:${w}%"></div>`;
      else if(off)bg+=`<div class="bg-off" style="left:${x}%;width:${w}%"></div>`;
      else if(workBgClass)bg+=`<div class="${workBgClass}" style="left:${x}%;width:${w}%"></div>`;
    });
    let grid=days.map((d,i)=>`<div class="lane-grid" style="left:${(i/7)*100}%"></div>`).join('');
    // a couple of assignment chips spread across days
    let cards='';
    const myDays=[[1,2],[2,1],[0,3],[3,2]][si%4]||[];
    if(myDays.length && si!==5){
      const [di,cnt]=myDays;const x=(di/7)*100+1;
      cards=`<div class="asg ${['assigned','confirmed','progress','completed'][si%4]}" style="left:${x}%;width:${100/7-2}%;height:30px;top:11px"><div>${cnt} visit${cnt>1?'s':''}</div></div>`;
    }
    return `<div class="tl-row"><div class="tl-name"><span class="av" style="background:${s.c}">${s.i}</span><div><div class="nm">${s.n}</div><div class="fc">${s.fc}</div></div></div><div class="tl-lane">${bg}${grid}${cards}</div></div>`;
  }).join('');
  return `<div class="tl" style="--namew:${NAMEW}px"><div class="tl-head"><div class="corner">Staff</div><div class="tl-axis">${axis}</div></div>${rows}</div>`;
}

/* ---------- notes ---------- */
function noteA(){return `<div class="note"><b>A — Enhanced Timeline.</b> A direct upgrade of today's Staff Assignment (vis-timeline): horizontal hourly axis, staff rows, now-line. Working hours render clear, off-hours hatched grey, leave hatched red; assignment cards keep their state colours. Dragging a card onto a hatched zone is refused (see the red "Can't drop — on leave" ghost). <span class="pro">Pros:</span> familiar to your team, reuses the existing view/model, lowest build risk. <span class="con">Trade-off:</span> needs custom JS on the OCA wrapper for background shading + drag-constraints (the wrapper doesn't expose them today).</div>`;}
function noteB(){return `<div class="note"><b>B — Premium Scheduler (FullCalendar).</b> Same resource-row idea with best-in-class polish: business-hours shading (soft blue), crisp grid, mini-month navigator + per-staff utilisation rail, "+N more" stacking on busy rows. Constraint highlighting and drag-rejection are built into FullCalendar. <span class="pro">Pros:</span> most refined UX, constraints &amp; businessHours are first-class. <span class="con">Trade-off:</span> new JS dependency to vendor &amp; integrate into OWL; licensing of the resource-timeline plugin to confirm (premium add-on).</div>`;}
function noteC(){return `<div class="note"><b>C — Ops Dashboard.</b> A VU-themed evolution of your Roster Planning: each staff member is a lane card with a 30-min availability heatmap (blue = working, hatched = off/leave), a capacity bar, and a status pill; an "Unassigned bookings" side rail holds bookings to drag onto a free cell. <span class="pro">Pros:</span> richest at-a-glance ops picture, fully on-brand, no third-party library, total control of drag rules. <span class="con">Trade-off:</span> most bespoke code to build &amp; maintain; heatmap is coarser than a pixel-precise Gantt for long/odd-length visits.</div>`;}

/* ---------- view state + render ---------- */
let cur='pa';
const viewState={pa:'day',pb:'day',pc:'day'};
function renderPanel(id){
  const v=viewState[id];
  if(id==='pa')document.getElementById('pa').innerHTML=renderA(v);
  if(id==='pb')document.getElementById('pb').innerHTML=renderB(v);
  if(id==='pc')document.getElementById('pc').innerHTML=renderC(v);
}
function setView(id,v){viewState[id]=v;renderPanel(id);}
function show(btn){
  cur=btn.dataset.p;
  document.querySelectorAll('.ctab').forEach(b=>b.classList.toggle('on',b===btn));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===cur));
  renderPanel(cur);window.scrollTo({top:0});
}
['pa','pb','pc'].forEach(renderPanel);
</script>
</body>
