# /etc/biz-tenants.conf — the platform's own facts, in one root-owned file.
#
# Every value here is interpolated into root-owned nginx configuration by
# biz-tenant-cert / biz-domain-attach / biz-domain-detach, so the scripts
# re-validate whatever they read. Installed 0644 root:root.
#
# Change APEX_DOMAIN the day the platform's own address changes; nothing else
# in the three scripts names a domain.

# The platform's apex. Tenant hostnames are <slug>.$APEX_DOMAIN.
APEX_DOMAIN=carejiox.com

# Prefix for the nginx files and Let's Encrypt certificate names this platform
# generates: <prefix><hostname>.conf. Keeps generated blocks obviously ours.
BLOCK_PREFIX=biz-tenant-

# Where the static status page lives (nginx serves it; the application writes it).
STATUS_DIR=/var/www/carejiox-status

# Whether this Odoo build honours a per-request database-pinning request header.
#
# A client-owned custom domain (clinic.example.com) cannot be routed by
# `dbfilter = ^%d$`, because the first label of that hostname is not the
# tenant's database name. Payobook's platform pins the database with an
# `X-Odoo-dbfilter` request header, which its (newer) Odoo build reads.
#
# THIS BUILD DOES NOT. `odoo/http.py: db_filter()` reads only `config['dbfilter']`
# and the Host header; the only header it looks at is `X-Odoo-Database`, which
# is checked THROUGH `db_filter()` and marks the session stateless — so it
# cannot pin a custom domain either. Verified 2026-09-04 on
# /odoo/odoo-server (Odoo 19, commit ac6d4f02).
#
# While this is 0, biz-domain-attach refuses to attach a custom domain rather
# than writing a block that silently routes to the wrong database (or to none).
# Set it to 1 only once the build actually honours the header AND the header
# name below is right.
CUSTOM_DOMAIN_PINNING=0
PIN_HEADER=X-Odoo-dbfilter
