# /etc/biz-tenants.conf — the platform's own facts, in one root-owned file.
#
# Every value here is interpolated into root-owned nginx configuration by
# biz-tenant-cert / biz-domain-attach / biz-domain-detach, so the scripts
# re-validate whatever they read. Installed 0644 root:root.
#
# Change APEX_DOMAIN the day the platform's own address changes; nothing else
# in the three scripts names a domain.

# The platform's apex. Tenant hostnames are <slug>.$APEX_DOMAIN.
APEX_DOMAIN=carejiox.com

# Prefix for the nginx files and Let's Encrypt certificate names this platform
# generates: <prefix><hostname>.conf. Keeps generated blocks obviously ours.
BLOCK_PREFIX=biz-tenant-

# Where the static status page lives (nginx serves it; the application writes it).
STATUS_DIR=/var/www/carejiox-status

# Enable only after biz_domain_router is in server_wide_modules and the
# root-owned /etc/carejiox-domains.json file exists. Routing uses an exact
# hostname map; no client-supplied database header is trusted.
CUSTOM_DOMAIN_PINNING=0
# Retained for compatibility with old configuration readers; unused by routing.
PIN_HEADER=X-Odoo-dbfilter
