# Included only by the exact carejiyo.com/HHH TLS virtual hosts.
# Preserve the real host for the root-owned biz_domain_router map.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
add_header X-Frame-Options "SAMEORIGIN";

proxy_buffers 16 64k;
proxy_buffer_size 128k;
proxy_read_timeout 900s;
proxy_connect_timeout 900s;
proxy_send_timeout 900s;
client_max_body_size 128M;
client_header_buffer_size 4k;
large_client_header_buffers 4 64k;

gzip on;
gzip_min_length 1100;
gzip_vary on;
gzip_types text/css text/plain text/xml application/xml application/json application/javascript;

location = /web/database { return 404; }
location ^~ /web/database/ { return 404; }

location /websocket {
    proxy_pass http://127.0.0.1:8072;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    proxy_pass http://127.0.0.1:8069;
    proxy_redirect off;
}

location ~ /[a-zA-Z0-9_-]*/static/ {
    proxy_cache_valid 200 302 60m;
    proxy_buffering on;
    expires 864000;
    proxy_pass http://127.0.0.1:8069;
}
