# Phase 1 HTTP-01 bootstrap only. Replace with carejiyo.conf after issuance.
# Do not serve application login or patient data over unencrypted HTTP.
server {
    listen 80;
    server_name carejiyo.com www.carejiyo.com hhh.carejiyo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/carejiyo-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 120 always;
        return 503;
    }
}
