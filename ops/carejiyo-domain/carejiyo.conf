# Parallel aliases only: old domains and channel registrations remain live.
# Exact hosts deliberately exclude wildcard, template and staging databases.
server {
    listen 443 ssl http2;
    server_name carejiyo.com www.carejiyo.com;

    ssl_certificate /etc/letsencrypt/live/carejiyo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carejiyo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/odoo-access.log;
    error_log /var/log/nginx/odoo-error.log;

    location = /status {
        alias /var/www/carejiox-status/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }
    location ^~ /status/ {
        alias /var/www/carejiox-status/;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    include /etc/nginx/snippets/carejiyo-proxy.conf;
}

server {
    listen 443 ssl http2;
    server_name hhh.carejiyo.com;

    ssl_certificate /etc/letsencrypt/live/carejiyo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carejiyo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/tenants-access.log;
    error_log /var/log/nginx/tenants-error.log;

    include /etc/nginx/snippets/carejiyo-proxy.conf;
}

server {
    listen 80;
    server_name carejiyo.com www.carejiyo.com hhh.carejiyo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/carejiyo-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
