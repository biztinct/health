# FHIR conformance gate — control C1 (gap register item G4).
#
# The register's largest process gap was not a missing test, it was that the
# conformance tests "run only when someone remembers". This runs them on every
# change that can reach the facade, and fails the change if they do not pass.
#
# Two failure modes are treated as failures, not one:
#   - the odoo run exits non-zero, or its result line is not "0 failed,
#     0 error(s)";
#   - the run was GREEN OVER ZERO EXECUTED TESTS. Conventions §5.83: a suite
#     that never executed is indistinguishable from a suite that passed, and
#     that is how 28 HttpCase classes in this repo sat un-run for months.
#     The executed-test count is asserted explicitly.
name: FHIR conformance

on:
  push:
    branches: ['**']
    paths:
      - 'addons/health_fhir_*/**'
      - 'addons/health_condition/**'
      - 'addons/health_base/**'
      - '.github/workflows/fhir-conformance.yml'
  pull_request:
    paths:
      - 'addons/health_fhir_*/**'
      - 'addons/health_condition/**'
      - 'addons/health_base/**'
      - '.github/workflows/fhir-conformance.yml'
  workflow_dispatch:

concurrency:
  group: fhir-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The deployment's own Odoo major version. Never float this to `latest`:
    # the point of the gate is to test what production runs.
    container:
      image: odoo:19
      options: --user root

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_DB: ci_test
      CI_LOG: /tmp/fhir-conformance.log
      # Our modules. NOTE, measured from a run's own startup line: Odoo 19
      # resolves `odoo.addons` as a namespace package and its built-in paths
      # come FIRST regardless of what --addons-path says —
      #   addons paths: ['/usr/lib/python3/dist-packages/odoo/addons',
      #                  '/var/lib/odoo/addons/19.0',
      #                  '/__w/health/health/addons', ...]
      # so the image's stock core modules win over the patched copies this
      # repo tracks (account, crm, mail, web, …). CI therefore tests OUR
      # modules against STOCK Odoo 19, not against the deployment's core.
      # That is a real fidelity limit of this gate, documented in
      # docs/conformance/ci-runbook.md — control C3 is what covers the
      # deployed combination.
      CI_ADDONS_PATH: addons
      # Floor for gate 3. A floor, not a pin: it fails on collapse (a module
      # that silently failed to install, a --test-tags typo), not on growth.
      MIN_EXECUTED: '50'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 8.3.0 is the version the R4/R4B equivalence argument is scoped to
      # (docs/conformance/r4-r4b-equivalence.md, register item G11).
      #
      # This is four steps rather than one on purpose. Actions logs need
      # repo-admin rights to download, but every step's NAME and CONCLUSION
      # are public — so splitting the install into named attempts makes the
      # failure diagnosable from the run summary alone, by whoever is looking.
      # The odoo image is Debian: it may ship no pip at all, and if it does,
      # PEP 668 refuses to install into the system interpreter.
      - name: pip — probe the image
        id: probe_pip
        continue-on-error: true
        run: |
          printf '::warning::pip: %s\n' "$(python3 -m pip --version 2>&1 | head -1)"
          python3 -m pip --version

      - name: pip — bootstrap (image had none)
        if: steps.probe_pip.outcome != 'success'
        run: |
          python3 -m ensurepip --default-pip \
            || { apt-get update -qq && apt-get install -y -qq python3-pip; }
          python3 -m pip --version

      # Every `external_dependencies.python` the module closure declares,
      # plus `packaging` — Odoo 19 parses external_dependencies through
      # `packaging.Requirement` and refuses to install ANY module without it
      # ("Package `packaging` is required to parse `fhir.resources` external
      # dependency and is not installed"). The image ships neither.
      #
      # Two pip calls, and both flags are load-bearing:
      #
      #  --ignore-installed  pip cannot uninstall a dpkg-owned package
      #      ("Cannot uninstall typing_extensions 4.10.0, RECORD file not
      #      found. Hint: The package was installed by debian"), so it has to
      #      install alongside rather than replace. Without this the whole
      #      install aborts and nothing is installed at all.
      #
      #  --no-deps (second call only)  pywebpush, http-ece and py-vapid all
      #      depend on `cryptography`. Letting pip resolve it installs a newer
      #      one that shadows the copy the image's system pyOpenSSL is linked
      #      against, and `import OpenSSL` then dies with "module 'lib' has no
      #      attribute GEN_EMAIL" — taking `odoo.addons.base`, and the entire
      #      server, with it. Conventions §1 records the same chain breaking
      #      the deployment. The image already provides cryptography; leave it
      #      exactly as it is.
      - name: deps — install (system, alongside the Debian-owned copies)
        id: pip_sys
        continue-on-error: true
        run: |
          set +e
          python3 -m pip install --break-system-packages --ignore-installed \
            packaging 'fhir.resources==8.3.0' > /tmp/pipsys.log 2>&1
          rc1=$?
          python3 -m pip install --break-system-packages --ignore-installed --no-deps \
            'pywebpush==2.3.0' 'http-ece' 'py-vapid' >> /tmp/pipsys.log 2>&1
          rc2=$?
          echo "fhir=$rc1 push=$rc2" > /tmp/pipsys.exit
          tail -25 /tmp/pipsys.log
          [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ]

      - name: deps — why the system install was refused
        if: steps.pip_sys.outcome != 'success'
        run: |
          esc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          printf '::warning::system install exits (%s):%%0A%s\n' \
            "$(cat /tmp/pipsys.exit 2>/dev/null || echo '?')" \
            "$(tail -25 /tmp/pipsys.log 2>/dev/null | esc)"

      - name: deps — install (--target fallback, de-shadowed)
        if: steps.pip_sys.outcome != 'success'
        run: |
          python3 -m pip install --target /opt/fhirlibs \
            packaging 'fhir.resources==8.3.0'
          python3 -m pip install --target /opt/fhirlibs --no-deps \
            'pywebpush==2.3.0' 'http-ece' 'py-vapid'
          # PYTHONPATH precedes site-packages, so anything here shadows the
          # image's copy. Drop only what is binary-coupled to the image's
          # OpenSSL; newer pure-Python copies are harmless, and pruning them
          # all is what broke an earlier run (pydantic needs a newer
          # typing_extensions than Debian ships).
          python3 /dev/stdin <<'PRUNE'
          import os, shutil
          COUPLED = ('cryptography', 'cffi', '_cffi_backend', 'OpenSSL')
          target = '/opt/fhirlibs'
          removed, kept = [], []
          for entry in sorted(os.listdir(target)):
              if entry.endswith(('.dist-info', '.egg-info')) or entry == '__pycache__':
                  continue
              stem = entry.split('.')[0]
              path = os.path.join(target, entry)
              if stem in COUPLED:
                  shutil.rmtree(path, ignore_errors=True) if os.path.isdir(path) else os.remove(path)
                  removed.append(entry)
              else:
                  kept.append(entry)
          print('::warning::target dir — kept: %s' % (', '.join(kept) or '(none)'))
          print('::warning::target dir — dropped as binary-coupled: %s'
                % (', '.join(removed) or '(none)'))
          PRUNE
          echo "PYTHONPATH=/opt/fhirlibs" >> "$GITHUB_ENV"

      - name: deps — confirm they resolve
        run: |
          set +e
          esc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          fail=0
          check() {  # check <label> <python snippet>
            out="$(python3 -c "$2" 2>&1)"
            if [ $? -eq 0 ]; then
              echo "ok: $1 — $out"
            else
              printf '::error::%s failed:%%0A%s\n' "$1" "$(printf '%s' "$out" | esc)"
              fail=1
            fi
          }
          check "packaging import"       "from packaging.requirements import Requirement; print('ok')"
          check "fhir.resources version" "import importlib.metadata as m; print(m.version('fhir.resources'))"
          check "pywebpush version"      "import importlib.metadata as m; print(m.version('pywebpush'))"
          check "fhir.resources R4B"     "from fhir.resources.R4B.patient import Patient; print('R4B ok')"
          check "pywebpush import"       "import pywebpush; print('ok')"
          # The canary for the shadowing failure: if pyOpenSSL breaks, odoo
          # cannot load `base` at all and nothing after it means anything.
          check "pyOpenSSL import"       "import OpenSSL; print('ok')"
          exit "$fail"

      - name: probe — the odoo binary in this image
        run: |
          warn() { printf '::warning::%s\n' "$1"; }
          warn "which odoo: $(command -v odoo || echo 'NOT ON PATH')"
          warn "odoo --version: $(odoo --version 2>&1 | head -2 | tr '\n' ' ')"
          warn "python3: $(python3 --version 2>&1) | free: $(free -m 2>/dev/null | awk '/Mem:/{print $2"MB total, "$7"MB avail"}')"

      - name: Install the FHIR modules and run their tests
        id: odoo
        continue-on-error: true
        run: |
          # No `-e` and no pipefail here: the exit code is the thing being
          # measured, so it has to survive to the next line. `tee` rather than
          # --logfile because odoo can die before it opens a logfile, and a
          # missing log is the one failure mode that tells you nothing.
          set +e
          odoo \
            -d "$CI_DB" \
            --addons-path="$CI_ADDONS_PATH" \
            -i health_fhir_core,health_fhir_terminology,health_condition \
            --test-enable \
            --test-tags '/health_fhir_core,/health_fhir_terminology,/health_condition' \
            --stop-after-init \
            --workers=0 \
            --without-demo=True \
            --db_host=postgres \
            --db_user=odoo \
            --db_password=odoo \
            --log-level=test 2>&1 | tee "$CI_LOG"
          ODOO_EXIT=${PIPESTATUS[0]}
          echo "$ODOO_EXIT" > /tmp/odoo.exit
          echo "odoo exit code: $ODOO_EXIT"
          exit "$ODOO_EXIT"

      # Diagnostics as ANNOTATIONS, not log lines: the check-runs API serves
      # annotations publicly, Actions logs need repo-admin rights. Without
      # this a red build is unreadable to anyone without those rights.
      - name: diagnose — what the odoo run actually did
        if: steps.odoo.outcome != 'success'
        run: |
          esc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          printf '::warning::odoo exit code: %s\n' "$(cat /tmp/odoo.exit 2>/dev/null || echo '<none>')"
          printf '::warning::log file: %s bytes at %s\n' \
            "$(wc -c < "$CI_LOG" 2>/dev/null || echo 0)" "$CI_LOG"
          printf '::warning::first 30 lines:%%0A%s\n' "$(head -30 "$CI_LOG" 2>/dev/null | esc)"
          printf '::warning::last 30 lines:%%0A%s\n' "$(tail -30 "$CI_LOG" 2>/dev/null | esc)"

      # Four gates, each its own step, each allowed to fail hard.
      #
      # No `continue-on-error` here, deliberately: it rewrites a step's public
      # `conclusion` to success, so a run whose gates all read "success" can
      # still be red — which is exactly what the first attempt produced.
      # Failing honestly means the first red step NAMES the gate that rejected
      # the build and the rest read `skipped`.
      #
      # Each failure also emits a `::error::` annotation carrying the relevant
      # log lines. Annotations are served by the public check-runs API, so a
      # red build explains itself to anyone — Actions LOGS need repo-admin
      # rights, annotations do not. `%0A` is GitHub's newline escape.
      - name: gate 1 — odoo exited zero
        run: |
          annotate() {
            printf '::error::%s%%0A%s\n' "$1" \
              "$(tail -25 "$CI_LOG" 2>/dev/null | sed 's/%/%25/g' \
                 | awk '{printf "%s%%0A", $0}')"
          }
          echo "odoo step outcome: ${{ steps.odoo.outcome }}"
          if [ "${{ steps.odoo.outcome }}" != "success" ]; then
            annotate "odoo exited non-zero (an EXIT:1 with FAIL:0 means read the ERROR lines — conventions 5.75). Tail of the run:"
            exit 1
          fi

      - name: gate 0 — the run produced output
        run: |
          ls -l "$CI_LOG" || true
          [ -s "$CI_LOG" ] || {
            echo "::error::odoo produced no output at all — the command never ran"
            exit 1
          }

      - name: gate 2 — an odoo.tests.result line exists and is clean
        run: |
          RESULT="$(grep -a 'odoo.tests.result' "$CI_LOG" | tail -1)"
          echo "result: ${RESULT:-<none>}"
          if [ -z "$RESULT" ]; then
            echo "::error::no odoo.tests.result line — no test suite ran"
            exit 1
          fi
          case "$RESULT" in
            *"0 failed, 0 error(s)"*) ;;
            *)
              FAILED="$(grep -a 'FAIL: \|ERROR: ' "$CI_LOG" | head -12 \
                | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              printf '::error::%s%%0A%s\n' "$RESULT" "$FAILED"
              exit 1 ;;
          esac

      - name: gate 3 — enough test methods actually executed
        run: |
          EXECUTED="$(grep -ac 'Starting Test.*\.test_' "$CI_LOG" || true)"
          echo "executed test methods: $EXECUTED (floor $MIN_EXECUTED)"
          if [ "${EXECUTED:-0}" -lt "$MIN_EXECUTED" ]; then
            echo "::error::only $EXECUTED test methods executed — the suite did not really run (conventions 5.83)"
            exit 1
          fi
          echo "FHIR conformance gate PASSED — $EXECUTED tests, 0 failed, 0 error(s)"

      # The log has to be copied into the WORKSPACE first: `upload-artifact`
      # is a JavaScript action and JS actions run on the runner host, not
      # inside the job container, so a container-only path like /tmp is
      # invisible to it ("No files were found with the provided path").
      # The workspace is the one directory both sides share.
      - name: Stage the odoo log for upload
        if: always()
        run: cp "$CI_LOG" "$GITHUB_WORKSPACE/odoo-conformance.log" 2>/dev/null || true

      - name: Upload the odoo log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-conformance-log
          path: odoo-conformance.log
          if-no-files-found: warn
