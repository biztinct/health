# FHIR conformance gate — control C1 (gap register item G4).
#
# The register's largest process gap was not a missing test, it was that the
# conformance tests "run only when someone remembers". This runs them on every
# change that can reach the facade, and fails the change if they do not pass.
#
# Two failure modes are treated as failures, not one:
#   - the odoo run exits non-zero, or its result line is not "0 failed,
#     0 error(s)";
#   - the run was GREEN OVER ZERO EXECUTED TESTS. Conventions §5.83: a suite
#     that never executed is indistinguishable from a suite that passed, and
#     that is how 28 HttpCase classes in this repo sat un-run for months.
#     The executed-test count is asserted explicitly.
name: FHIR conformance

on:
  push:
    branches: ['**']
    paths:
      - 'addons/health_fhir_*/**'
      - 'addons/health_condition/**'
      - 'addons/health_base/**'
      - '.github/workflows/fhir-conformance.yml'
  pull_request:
    paths:
      - 'addons/health_fhir_*/**'
      - 'addons/health_condition/**'
      - 'addons/health_base/**'
      - '.github/workflows/fhir-conformance.yml'
  workflow_dispatch:

concurrency:
  group: fhir-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The deployment's own Odoo major version. Never float this to `latest`:
    # the point of the gate is to test what production runs.
    container:
      image: odoo:19
      options: --user root

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_DB: ci_test
      CI_LOG: /tmp/fhir-conformance.log
      # `addons` FIRST, then the image's packaged addons. This mirrors the
      # server, where /odoo/odoo-server/addons is a single directory holding
      # both our modules and the (patched) core copies this repo tracks —
      # putting the image's copies first would silently test different code
      # from the one that is deployed.
      CI_ADDONS_PATH: addons,/usr/lib/python3/dist-packages/odoo/addons
      # Floor for gate 3. A floor, not a pin: it fails on collapse (a module
      # that silently failed to install, a --test-tags typo), not on growth.
      MIN_EXECUTED: '50'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 8.3.0 is the version the R4/R4B equivalence argument is scoped to
      # (docs/conformance/r4-r4b-equivalence.md, register item G11).
      #
      # This is four steps rather than one on purpose. Actions logs need
      # repo-admin rights to download, but every step's NAME and CONCLUSION
      # are public — so splitting the install into named attempts makes the
      # failure diagnosable from the run summary alone, by whoever is looking.
      # The odoo image is Debian: it may ship no pip at all, and if it does,
      # PEP 668 refuses to install into the system interpreter.
      - name: pip — probe the image
        id: probe_pip
        continue-on-error: true
        run: python3 -m pip --version

      - name: pip — bootstrap (image had none)
        if: steps.probe_pip.outcome != 'success'
        run: |
          python3 -m ensurepip --default-pip \
            || { apt-get update -qq && apt-get install -y -qq python3-pip; }
          python3 -m pip --version

      - name: fhir.resources — install (PEP 668 override)
        id: pip_break
        continue-on-error: true
        run: python3 -m pip install --break-system-packages 'fhir.resources==8.3.0'

      - name: fhir.resources — install (plain)
        id: pip_plain
        if: steps.pip_break.outcome != 'success'
        continue-on-error: true
        run: python3 -m pip install 'fhir.resources==8.3.0'

      - name: fhir.resources — install (--target + PYTHONPATH)
        if: steps.pip_break.outcome != 'success' && steps.pip_plain.outcome != 'success'
        run: |
          python3 -m pip install --target /opt/fhirlibs 'fhir.resources==8.3.0'
          echo "PYTHONPATH=/opt/fhirlibs${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: fhir.resources — confirm the pin resolves
        run: |
          python3 -c "import importlib.metadata as m; \
            print('fhir.resources', m.version('fhir.resources'))"
          python3 -c "from fhir.resources.R4B.patient import Patient; print('R4B ok')"

      - name: Install the FHIR modules and run their tests
        id: odoo
        continue-on-error: true
        run: |
          set -o pipefail
          # `tee` rather than --logfile: odoo can die before it opens a
          # logfile (bad option, unreachable database), and a missing log is
          # the one failure mode that tells you nothing. Piping guarantees the
          # gates below always have something to read, including the reason.
          odoo \
            -d "$CI_DB" \
            --addons-path="$CI_ADDONS_PATH" \
            -i health_fhir_core,health_fhir_terminology,health_condition \
            --test-enable \
            --test-tags '/health_fhir_core,/health_fhir_terminology,/health_condition' \
            --stop-after-init \
            --workers=0 \
            --without-demo=all \
            --db_host=postgres \
            --db_user=odoo \
            --db_password=odoo \
            --log-level=test 2>&1 | tee "$CI_LOG"

      # Four gates, each its own step, each allowed to fail hard.
      #
      # No `continue-on-error` here, deliberately: it rewrites a step's public
      # `conclusion` to success, so a run whose gates all read "success" can
      # still be red — which is exactly what the first attempt produced.
      # Failing honestly means the first red step NAMES the gate that rejected
      # the build and the rest read `skipped`.
      #
      # Each failure also emits a `::error::` annotation carrying the relevant
      # log lines. Annotations are served by the public check-runs API, so a
      # red build explains itself to anyone — Actions LOGS need repo-admin
      # rights, annotations do not. `%0A` is GitHub's newline escape.
      - name: gate 1 — odoo exited zero
        run: |
          annotate() {
            printf '::error::%s%%0A%s\n' "$1" \
              "$(tail -25 "$CI_LOG" 2>/dev/null | sed 's/%/%25/g' \
                 | awk '{printf "%s%%0A", $0}')"
          }
          echo "odoo step outcome: ${{ steps.odoo.outcome }}"
          if [ "${{ steps.odoo.outcome }}" != "success" ]; then
            annotate "odoo exited non-zero (an EXIT:1 with FAIL:0 means read the ERROR lines — conventions 5.75). Tail of the run:"
            exit 1
          fi

      - name: gate 0 — the run produced output
        run: |
          ls -l "$CI_LOG" || true
          [ -s "$CI_LOG" ] || {
            echo "::error::odoo produced no output at all — the command never ran"
            exit 1
          }

      - name: gate 2 — an odoo.tests.result line exists and is clean
        run: |
          RESULT="$(grep -a 'odoo.tests.result' "$CI_LOG" | tail -1)"
          echo "result: ${RESULT:-<none>}"
          if [ -z "$RESULT" ]; then
            echo "::error::no odoo.tests.result line — no test suite ran"
            exit 1
          fi
          case "$RESULT" in
            *"0 failed, 0 error(s)"*) ;;
            *)
              FAILED="$(grep -a 'FAIL: \|ERROR: ' "$CI_LOG" | head -12 \
                | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              printf '::error::%s%%0A%s\n' "$RESULT" "$FAILED"
              exit 1 ;;
          esac

      - name: gate 3 — enough test methods actually executed
        run: |
          EXECUTED="$(grep -ac 'Starting Test.*\.test_' "$CI_LOG" || true)"
          echo "executed test methods: $EXECUTED (floor $MIN_EXECUTED)"
          if [ "${EXECUTED:-0}" -lt "$MIN_EXECUTED" ]; then
            echo "::error::only $EXECUTED test methods executed — the suite did not really run (conventions 5.83)"
            exit 1
          fi
          echo "FHIR conformance gate PASSED — $EXECUTED tests, 0 failed, 0 error(s)"

      - name: Upload the odoo log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-conformance-log
          path: /tmp/fhir-conformance.log
          if-no-files-found: warn
