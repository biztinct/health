<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">✳</div><div>viet uc<small>CARE, CONNECTED.</small></div></div><div class="workspace"><div class="mini">V</div><div><strong style="font-size:11px">Viet UC Healthcare</strong><span>Care operations ⌄</span></div></div><div class="nav-label">WORKSPACE</div><button class="nav secondary" data-action="overview"><span class="symbol">▦</span>Overview</button><button class="nav" data-screen="contact"><span class="symbol">◎</span>Contacts<span class="count">24</span></button><button class="nav active" data-screen="booking"><span class="symbol">▤</span>Bookings<span class="count">12</span></button><button class="nav" data-screen="client"><span class="symbol">♧</span>Clients</button><button class="nav secondary" data-action="schedule"><span class="symbol">▦</span>Schedule</button><button class="nav secondary" data-action="inbox"><span class="symbol">▱</span>Family inbox<span class="dot" style="margin-left:auto"></span></button><div class="nav-label" style="margin-top:30px">MANAGE</div><button class="nav secondary" data-action="collections"><span class="symbol">▣</span>Collections</button><button class="nav secondary" data-action="team"><span class="symbol">♧</span>Care team</button><button class="nav secondary" data-action="insights"><span class="symbol">⌁</span>Insights</button><div class="sidebar-bottom"><button class="nav" data-action="guide"><span class="symbol">✧</span>Design guide<span style="margin-left:auto;font-size:9px">↗</span></button><div class="user"><span class="avatar">MA</span><div><strong>Minh Anh</strong><small>Care coordinator</small></div><span style="margin-left:auto;color:#8d9785">⌄</span></div></div></aside>

<script>
const $=s=>document.querySelector(s);let screen='booking',tab='Overview',dirty=false,assigned='',stage=1,notes=[],contactNotes=[],charges=0,paid=false,bookingDate='2026-09-30',bookingTime='09:00';const draft={};
const field=(label,value='',type='text',opts='')=>`<label class="field ${type==='textarea'?'wide':''}"><span>${label}</span>${type==='select'?`<select name="${label}">${opts.split('|').map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${label}" placeholder="${escapeHTML(String(value))}"></textarea>`:`<input name="${label}" type="${type}" value="${escapeHTML(String(value))}" ${type==='number'?'min="0"':''}>`}</label>`;
const badge=(text,cls='')=>`<span class="badge ${cls}">${text}</span>`;const btn=(text,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${text}</button>`;
function shell(name,initials,status,meta,actions){return `<div class="record-head"><div class="large-avatar">${initials}</div><div><div class="record-name"><h1>${name}</h1>${badge(status)}</div><div class="record-meta">${meta}</div></div><div class="head-actions">${actions}</div></div>`}
function metrics(items){return `<div class="summary-strip">${items.map(([label,val,cls])=>`<div class="metric ${cls||''}"><label>${label}</label><strong>${val}</strong></div>`).join('')}</div>`}
function tabs(items){return `<div class="tabs" aria-label="Record sections">${items.map(([x,n])=>`<button class="tab ${tab===x?'active':''}" data-tab="${x}" aria-current="${tab===x?'page':'false'}">${x}${n?`<span>${n}</span>`:''}</button>`).join('')}<span class="saved" id="saved">✓ &nbsp; All changes saved</span></div>`}
function card(title,body,action='',cls=''){return `<section class="card ${cls}"><div class="card-head"><h2>${title}</h2>${action}</div>${body}</section>`}
function fold(title,caption,body){return `<details class="fold"><summary>${title}<span>${caption}</span></summary>${body}</details>`}

if(a==='relationship'){drawer('Bring the family together',`<p class="note">Link a sample family contact to this enquiry.</p><div class="fields">${field('Contact name')}${field('Relationship','Daughter','select','Daughter|Son|Spouse|Other family member')}</div>${btn('Add relationship','saverelationship','primary')}`);return}
if(a==='saverelationship'){if(!value('Contact name').trim()){toast('Enter a contact name');return}relationships.push(value('Contact name')+' · '+value('Relationship'));closeOverlay();render();toast('Relationship added');return}
if(a==='quote'){drawer(paid?'Payment receipt':'A clear view of the cost',`<p class="eyebrow">QUOTE · BK3831</p><div class="rule"></div><div class="row"><span>Home care · 120 minutes</span><strong>1,100,000 ₫</strong></div><div class="row"><span>Additional charges</span><strong>${charges.toLocaleString()} ₫</strong></div><div class="rule"></div><div class="row"><span>Total</span><strong class="money">${(1100000+charges).toLocaleString()} ₫</strong></div><div class="soft-box">${paid?'✓ Payment recorded in this preview.':'Payment status: Awaiting payment'}</div>${paid?'':btn('Simulate payment received','pay','primary')}<p class="note" style="font-size:10px;margin-top:20px">This is a design demonstration. No payment is collected and no invoice is issued.</p>`);return}
if(a==='pay'){paid=true;closeOverlay();render();toast('Sample payment recorded');return}
if(a==='start'||a==='complete'){stage=a==='start'?3:4;notes.unshift(a==='start'?'Visit started with '+assigned:'Visit completed by '+assigned);render();toast(a==='start'?'Visit marked in progress':'Visit marked completed');return}
if(a==='family'){drawer('Stay close to the family',`<div class="person"><span class="avatar">MX</span><div><strong>Mai Xu</strong><small>Daughter · Main contact</small></div></div><div class="rule"></div><div class="row"><span>Sample phone</span><strong>090 000 0202</strong></div><div class="row"><span>Preferred language</span><strong>Vietnamese</strong></div><div class="soft-box">Please call 15 minutes before the visit.</div><div class="rule"></div><p class="note">In the live product, this panel would connect to calling and messaging. You can try logging a family update below.</p>${btn('Log family update','log','primary')}`);return}
if(a==='more'){drawer('Record actions',`<p class="note">Everyday actions stay close. Less frequent actions have a quieter home here.</p>${btn('Add an internal note','log')}<div class="rule"></div><p class="note">Archive, delete and cancellation controls would live here in the final product, with role permissions and a confirmation step.</p><p class="note">This design preview keeps live records untouched.</p>`);return}
if(a==='search'){showSearch();return}
if(a==='guide'){drawer('Less noise. More care.',`<p class="eyebrow">THE DESIGN DIRECTION</p><div class="rule"></div><h3 style="font:600 15px Manrope">A calm, capable workspace.</h3><p class="note" style="margin-top:12px">Warm ivory, botanical neutrals and a deep teal action colour bring a human quality to a clinical workflow.</p>${[['01 · One record, one clear story','Identity, status and the most useful action appear together. Secondary actions move into focused panels.'],['02 · Information earns its space','Counts become a single summary strip. Optional groups collapse to a line. Each column flows naturally without matching card heights.'],['03 · A next step, not a wall of buttons','The next action changes with the record: follow up, assign care, start a visit or review completion.'],['04 · Progressive detail','Overview answers everyday questions. Care, billing and activity tabs reveal depth on demand.'],['05 · Keep your place','Drawers handle assignments, scheduling and notes without sending you away from the record.']].map(([h,p])=>`<div class="rule"></div><h3 style="font-size:12px">${h}</h3><p class="note" style="margin-top:8px">${p}</p>`).join('')}<div class="rule"></div><p class="note">Try all three screens, edit and save a field, expand additional charges, assign a care professional, reschedule a visit and create a sample booking. All changes last for this page session only.</p>`);return}
const panels={overview:['Today, at a glance',`<p class="note">A sample overview of the care operation.</p><div class="row"><span>Enquiries to follow up</span><strong>24</strong></div><div class="row"><span>Upcoming bookings</span><strong>12</strong></div>${btn('Open current booking','openbooking','primary')}`],schedule:['Upcoming care',`<p class="note">30 September 2026 · Hà Nội</p><div class="soft-box">09:00 — 11:00 · Home visit · An Xu</div>${btn('Open visit','openbooking','primary')}`],inbox:['Family inbox',`<p class="note">Mai Xu · Today, 08:30</p><div class="soft-box">Morning works well for us. Please call before arriving.</div>${btn('View family contact','family','primary')}`],collections:['Collections',`<div class="row"><span>An Xu · BK3831</span><strong>${paid?'Paid':'1,100,000 ₫ due'}</strong></div>${btn('Review payment','quote','primary')}`],team:['People behind the care',`<p class="note">Find an available professional for the upcoming visit.</p>${btn('Explore care team','assign','primary')}`],insights:['Care in perspective',`<p class="note">These sample figures demonstrate a compact information layout.</p><div class="row"><span>Visits this week</span><strong>32</strong></div><div class="row"><span>Completed</span><strong>28</strong></div><div class="row"><span>Awaiting assignment</span><strong>4</strong></div>`],notifications:['Your attention, thoughtfully directed',timeline([['Care assignment needed','An Xu’s visit needs a care professional.','Upcoming visit'],['Family confirmed availability','Mai Xu prefers the morning slot.','Today, 08:30']])],pastvisit:['Completed nursing visit',`<p class="eyebrow">BK3790 · 24 SEP</p><div class="rule"></div><p class="note">60-minute nursing visit completed by Lan Nguyễn. Family preferences reviewed and next visit arranged.</p>${badge('Completed')}`],newdetails:['Sample booking created',createdBookings[0]?`<p class="eyebrow">${createdBookings[0].id}</p><div class="rule"></div><p class="note">${escapeHTML(createdBookings[0].service)} · ${formatDate(createdBookings[0].date)} · ${createdBookings[0].time}</p>${badge('New booking')}`:'']};if(panels[a])drawer(...panels[a]);
}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();showSearch()}if(e.key==='Escape')closeOverlay();if(e.key==='Tab'&&$('#overlay-root .drawer')){const nodes=[...document.querySelectorAll('#overlay-root button,#overlay-root input,#overlay-root select,#overlay-root textarea')].filter(x=>!x.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeOverlay()});
render();
</script></body></html>
